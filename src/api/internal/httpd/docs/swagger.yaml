  /v1/workspaces/{workspace_id}/cpc-party-branches/{id}/admission-rule:
    get:
      description: 复用党支部查看权限，仅查询当前空间；返回完整规则树及固定字段、逻辑、运算符目录，读取审计提交后返回。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - description: 党支部编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 准入规则树及当前版本
          schema:
            $ref: '#/definitions/partybranchModels.AdmissionRuleResponse'
      summary: 查看党支部准入规则
      tags:
      - 党支部
    put:
      consumes:
      - application/json
      description: |-
        复用党支部编辑权限。条件组 type=group，logic 支持 and、or，children 可多层嵌套。
        条件字段支持 advisor（导师姓名）、major（专业）、education_level（学生学历）、student_no（学号），operator 固定 in，values 为非空候选值集合，按完整文本匹配；学号最多 32 字符并保留前导零。
        rule=null 清空，未配置不表示全部准入；版本与党支部基础信息共用，写入和审计同事务，不自动授权、添加或重排人员。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - description: 党支部编号
        in: path
        name: id
        required: true
        type: integer
      - description: 完整规则树及当前 revision
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/partybranchModels.AdmissionRuleRequest'
      - default: "1"
        description: 固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 保存后的规则树及新版本
          schema:
            $ref: '#/definitions/partybranchModels.AdmissionRuleResponse'
      summary: 编辑党支部准入规则
      tags:
      - 党支部
