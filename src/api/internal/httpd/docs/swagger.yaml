basePath: /
definitions:
  accessModels.Action:
    properties:
      description:
        description: Description 说明操作范围及授权含义。
        example: 进入已启用且获得显式授权的工作空间
        type: string
      endpoints:
        description: Endpoints 是该操作对应的接口，尚无接口的保留操作为空数组。
        items:
          $ref: '#/definitions/accessModels.Endpoint'
        type: array
      group:
        allOf:
        - $ref: '#/definitions/accessModels.Option'
        description: Group 是操作所属的功能分组。
      label:
        description: Label 是操作中文名称。
        example: 进入工作空间
        type: string
      scope:
        description: Scope 区分 public、session、system 与 workspace，仅 workspace 可授予用户。
        example: workspace
        type: string
      value:
        description: Value 是稳定操作标识，不以中文名称参与权限判断。
        example: access_workspace
        type: string
    type: object
  accessModels.ActionsData:
    properties:
      actions:
        description: Actions 是登记过的 workspace 操作标识，空数组表示无权限。
        example:
        - access_workspace
        items:
          type: string
        type: array
      revision:
        description: Revision 是工作空间及其授权的共同版本。
        example: 1
        type: integer
    type: object
  accessModels.ActionsResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/accessModels.ActionsData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  accessModels.CatalogData:
    properties:
      items:
        description: Items 是已登记操作，只有 workspace 范围可勾选授权。
        items:
          $ref: '#/definitions/accessModels.Action'
        type: array
    type: object
  accessModels.CatalogResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/accessModels.CatalogData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  accessModels.ContextData:
    properties:
      actions:
        description: Actions 是当前有效的显式操作权限，不代表其他工作空间权限。
        example:
        - access_workspace
        items:
          type: string
        type: array
      can_review_project_applications:
        description: CanReviewProjectApplications 表示账号有填报查看权限且被指派为组织审批人，不替代显式授权。
        example: true
        type: boolean
      workspace:
        allOf:
        - $ref: '#/definitions/workspaceModels.Info'
        description: Workspace 是当前工作空间的基本信息。
    type: object
  accessModels.ContextResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/accessModels.ContextData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  accessModels.EmptyData:
    type: object
  accessModels.EmptyResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/accessModels.EmptyData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  accessModels.Endpoint:
    properties:
      method:
        description: Method 是大写 HTTP 方法。
        example: GET
        type: string
      path:
        description: Path 是接口路径模板，参数以冒号开头。
        example: /v1/workspaces/:workspace_id
        type: string
    type: object
  accessModels.Option:
    properties:
      label:
        description: Label 是中文显示名称。
        example: 工作空间
        type: string
      value:
        description: Value 是稳定英文代码。
        example: workspace
        type: string
    type: object
  accessModels.UpdateActionsRequest:
    properties:
      actions:
        description: Actions 只能包含目录中可授予用户的标识，禁止重复或未知操作。
        example:
        - access_workspace
        items:
          type: string
        type: array
      revision:
        description: Revision 必须与最近读取的工作空间授权版本一致，防止旧页面重新授予已撤销权限。
        example: 1
        type: integer
    required:
    - actions
    - revision
    type: object
  accessModels.UserInfo:
    properties:
      created_at:
        description: CreatedAt 是账号创建时间。
        example: "2026-11-03T00:00:00Z"
        type: string
      display_name:
        description: DisplayName 是显示名称。
        example: 张三
        type: string
      id:
        description: ID 是全局账号编号。
        example: 2
        type: integer
      is_enabled:
        description: IsEnabled 表示账号是否启用。
        example: true
        type: boolean
      permission_count:
        description: PermissionCount 是当前工作空间内有效的显式操作数量。
        example: 1
        type: integer
      updated_at:
        description: UpdatedAt 是账号最近修改时间。
        example: "2026-11-03T00:00:00Z"
        type: string
      username:
        description: Username 是登录账号。
        example: zhangsan
        type: string
    type: object
  accessModels.UserListData:
    properties:
      items:
        description: Items 是符合授权状态的本页账号与当前工作空间的有效授权数量。
        items:
          $ref: '#/definitions/accessModels.UserInfo'
        type: array
      page:
        description: Page 是当前页码。
        example: 1
        type: integer
      page_size:
        description: PageSize 是每页数量。
        example: 20
        type: integer
      total:
        description: Total 是符合条件的账号数量。
        example: 1
        type: integer
    type: object
  accessModels.UserListResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/accessModels.UserListData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  attachmentModels.CompleteUploadRequest:
    properties:
      revision:
        description: Revision 是申请返回的并发版本。
        example: 1
        type: integer
      upload_id:
        description: UploadID 是申请返回的上传编号。
        example: 1
        type: integer
    type: object
  attachmentModels.Info:
    properties:
      application_id:
        description: ApplicationID 是申报附件所属申报编号，其他类别不返回。
        example: 1
        type: integer
      category:
        description: Category 是不可修改的业务类别。
        example: project
        type: string
      created_at:
        description: CreatedAt 是创建时间。
        example: "2026-01-01T00:00:00Z"
        type: string
      detail_id:
        description: DetailID 是申报附件所属评分子项编号，其他类别不返回。
        example: 1
        type: integer
      filename:
        description: Filename 是中文原始文件名。
        example: 项目申报说明.pdf
        type: string
      id:
        description: ID 是附件编号。
        example: 1
        type: integer
      monthly_work_id:
        description: MonthlyWorkID 是月度工作附件所属记录编号，其他类别不返回此字段。
        example: 1
        type: integer
      node_id:
        description: NodeID 是附件所属模板内的稳定节点标识，其他类别不返回此字段。
        example: node_application
        type: string
      person_id:
        description: PersonID 是人员时间线附件所属人员编号，其他类别不返回。
        example: 1
        type: integer
      project_id:
        description: ProjectID 是项目附件所属项目编号，其他类别不返回此字段。
        example: 1
        type: integer
      revision:
        description: Revision 是并发版本。
        example: 1
        type: integer
      size:
        description: Size 是文件字节数。
        example: 1024
        type: integer
      state:
        description: State 是存储流程状态，pending 待完成、ready 可下载、deleting 待删除。
        example: ready
        type: string
      timeline_template_id:
        description: TimelineTemplateID 是时间线节点附件所属模板编号，其他类别不返回此字段。
        example: 1
        type: integer
      updated_at:
        description: UpdatedAt 是最近修改时间。
        example: "2026-01-01T00:00:00Z"
        type: string
    type: object
  attachmentModels.InfoResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/attachmentModels.Info'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  attachmentModels.ListData:
    properties:
      items:
        description: Items 是附件记录。
        items:
          $ref: '#/definitions/attachmentModels.Info'
        type: array
      page:
        description: Page 是当前页码。
        example: 1
        type: integer
      page_size:
        description: PageSize 是每页条数。
        example: 10
        type: integer
      total:
        description: Total 是记录总数。
        example: 1
        type: integer
    type: object
  attachmentModels.ListResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/attachmentModels.ListData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  attachmentModels.URLData:
    properties:
      filename:
        description: Filename 是原始文件名，供浏览器保存文件。
        example: 申报材料.pdf
        type: string
      url:
        description: URL 是按需签发的短期 CDN URL。
        example: https://cdn.example.com/resource?eo-sign=...
        type: string
    type: object
  attachmentModels.URLResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/attachmentModels.URLData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  attachmentModels.UploadData:
    properties:
      revision:
        description: Revision 是确认上传时使用的并发版本。
        example: 1
        type: integer
      upload:
        allOf:
        - $ref: '#/definitions/tencentcos.UploadParameters'
        description: Upload 是仅限本对象的 COS 临时上传凭据。
      upload_id:
        description: UploadID 是待完成附件编号。
        example: 1
        type: integer
    type: object
  attachmentModels.UploadRequest:
    properties:
      content_type:
        description: ContentType 是上传请求的声明媒体类型，由 STS 精确约束。
        example: application/pdf
        type: string
      filename:
        description: Filename 是保留的原始文件名，不能包含路径或策略通配符。
        example: 材料.pdf
        type: string
      size:
        description: Size 是文件准确字节数，须符合 YAML 的单文件限制。
        example: 1024
        type: integer
    type: object
  attachmentModels.UploadResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/attachmentModels.UploadData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  auditModels.Day:
    properties:
      date:
        description: Date 是 UTC 日期。
        example: "2026-11-16"
        type: string
      failure:
        description: Failure 是失败次数。
        example: 2
        type: integer
      success:
        description: Success 是成功次数。
        example: 30
        type: integer
    type: object
  auditModels.Detail:
    properties:
      access_source_ip:
        description: AccessSourceIP 是按可信代理规则确定的客户端 IP。
        example: 192.0.2.1
        type: string
      access_type:
        description: AccessType 为 web 1、mcp 2。
        example: 1
        type: integer
      access_user_agent:
        description: AccessUserAgent 是已清理控制字符的客户端信息。
        example: Mozilla/5.0
        type: string
      action_id:
        description: ActionID 是已登记的英文操作标识。
        example: student.update
        type: string
      end_time:
        description: EndTime 是审计生成时刻的 UTC Unix 毫秒值。
        example: 1794787200012
        type: integer
      event_content:
        description: EventContent 是事件中文说明，历史记录可以为空。
        example: 编辑学生信息
        type: string
        x-nullable: true
      event_date:
        description: EventDate 是开始时刻所属的 UTC 分区日期。
        example: "2026-11-16"
        type: string
      event_id:
        description: EventID 是保留的独立随机事件编号。
        example: 12f8f7ba823d4a8eac12b5db99db71b4
        type: string
      extend_data:
        allOf:
        - $ref: '#/definitions/auditModels.Extend'
        description: ExtendData 只保留方法与路由模板。
      has_sensitive_snapshot:
        description: HasSensitiveSnapshot 表示另有受保护快照，不返回密文、密钥或关联上下文。
        example: false
        type: boolean
      id:
        description: ID 是数据库分配的排序编号，按字符串传递以保留精度。
        example: "123"
        type: string
      instance_data:
        description: InstanceData 是变更后内容，未涉及为 JSON null。
        type: object
        x-nullable: true
      instance_id:
        description: InstanceID 是原资源编号，保留字符串和前导零。
        example: "7"
        type: string
      instance_name:
        description: InstanceName 是可选的安全名称。
        example: 示例对象
        type: string
        x-nullable: true
      instance_origin_data:
        description: InstanceOriginData 是变更前内容，未涉及为 JSON null。
        type: object
        x-nullable: true
      request_id:
        description: RequestID 保存事件的 OpenTelemetry Trace ID。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
      resource_type_id:
        description: ResourceTypeID 是固定业务资源类型。
        example: student
        type: string
      result_code:
        description: ResultCode 为成功 0 或非零数字状态、业务错误码。
        example: 0
        type: integer
      result_content:
        description: ResultContent 是可公开的错误说明，成功时为空。
        example: ""
        type: string
      snapshot_user_info:
        description: SnapshotUserInfo 完整保留操作者快照，不关联当前账号。
        type: object
      start_time:
        description: StartTime 是请求开始时刻的 UTC Unix 毫秒值。
        example: 1794787200000
        type: integer
      user_id:
        description: UserID 是组织账号或学生编号，按字符串保留完整精度。
        example: "1"
        type: string
      user_identify_tenant_id:
        description: UserIdentifyTenantID 为组织 system 或学生所属空间。
        example: system
        type: string
      user_identify_type:
        description: UserIdentifyType 为组织 1、学生 2。
        example: 1
        type: integer
      workspace_id:
        description: WorkspaceID 是业务空间编号，系统操作为 system。
        example: system
        type: string
    type: object
  auditModels.DetailResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/auditModels.Detail'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  auditModels.Extend:
    properties:
      method:
        description: Method 是 HTTP 方法或内部操作方法。
        example: PUT
        type: string
      path:
        description: Path 是路由模板，不包含原始查询参数。
        example: /v1/workspaces/:workspace_id/students/:id
        type: string
    type: object
  auditModels.ListData:
    properties:
      actions:
        description: Actions 是已登记的操作目录。
        items:
          $ref: '#/definitions/auditModels.Option'
        type: array
      end_time:
        description: EndTime 是 start_time 的实际筛选上界，不包含。
        example: 1794873600000
        type: integer
      items:
        description: Items 是当前页安全事件。
        items:
          $ref: '#/definitions/auditModels.Summary'
        type: array
      page:
        description: Page 是当前页码。
        example: 1
        type: integer
      page_size:
        description: PageSize 是每页条数。
        example: 20
        type: integer
      result_codes:
        description: ResultCodes 是时间窗口内的数字操作结果。
        items:
          $ref: '#/definitions/auditModels.Option'
        type: array
      start_time:
        description: StartTime 是实际筛选下界，UTC Unix 毫秒，包含。
        example: 1794787200000
        type: integer
      total:
        description: Total 是全部匹配记录数。
        example: 120
        type: integer
      user_tenants:
        description: UserTenants 是用户归属目录。
        items:
          $ref: '#/definitions/auditModels.Option'
        type: array
      workspaces:
        description: Workspaces 包含系统、停用与已删除的业务空间。
        items:
          $ref: '#/definitions/auditModels.Option'
        type: array
    type: object
  auditModels.ListResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/auditModels.ListData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
      trace:
        description: Trace 是当前请求的 OpenTelemetry Trace ID，关闭上报时仍然存在。
        example: 4bf92f3577b34da6a3ce929d0e0e4736
        type: string
    type: object
  auditModels.Option:
    properties:
      label:
        description: Label 是中文显示名称。
        example: 成功
        type: string
      value:
        description: Value 是协议字段值，数字代码以十进制文本提供给选项控件。
        example: "0"
        type: string
    type: object
  auditModels.StatisticsData:
    properties:
      days:
        description: Days 是 UTC 日期趋势，缺少记录的日期补零。
        items:
          $ref: '#/definitions/auditModels.Day'
        type: array
      denied:
        description: Denied 是结果码为 403 的次数。
        example: 3
        type: integer
      failure:
        description: Failure 是失败次数。
        example: 20
        type: integer
      success:
        description: Success 是成功次数。
        example: 100
        type: integer
      total:
        description: Total 是匹配记录总数。
        example: 120
        type: integer
    type: object
  auditModels.StatisticsResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/auditModels.StatisticsData'
        description: Data 是接口业务数据，结构由具体接口定义。
        x-nullable: true
      error_msg:
        description: ErrorMsg 是简体中文错误说明；请求成功时为空字符串。
        example: ""
        type: string
