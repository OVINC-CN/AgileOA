      - application/json
      responses:
        "200":
          description: API Token 及生成、重置时间
          schema:
            $ref: '#/definitions/userModels.APITokenResponse'
        "400":
          description: 账号编号无效
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "401":
          description: 请先登录
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "403":
          description: 仅系统管理员可访问
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "503":
          description: 账号或暂时无法完成操作，请稍后重试
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
