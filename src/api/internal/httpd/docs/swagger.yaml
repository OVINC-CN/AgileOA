        日期、工作项目和负责人必填，参与人可多选，说明及多条外部链接可选；负责人及参与人须为当前空间可用账号，不推导权限；附件在创建记录后单独上传。
        学生工作与党建工作通过各自路径访问，分别授权并隔离数据；请求体不接受类别字段。
