info:
  contact: {}
  description: 所有业务响应只包含 trace、error_msg、data；追踪始终开启。
  title: 敏捷办公 API
  version: "1.0"
paths:
  /health:
    get:
      description: 仅通过 HTTP 状态表达结果，data 固定为 null，不提供内部状态。
      produces:
      - application/json
      responses:
        "200":
          description: 进程存活，error_msg 为空，data 为 null
          schema:
            $ref: '#/definitions/homeModels.HealthResponse'
      summary: 进程存活检查
      tags:
      - 健康检查
  /ready:
    get:
      description: 仅通过 HTTP 状态表达结果，data 固定为 null，不公开依赖资源明细。
      produces:
      - application/json
      responses:
        "200":
          description: 服务就绪，error_msg 为空，data 为 null
          schema:
            $ref: '#/definitions/homeModels.HealthResponse'
      summary: 服务就绪检查
      tags:
      - 健康检查
  /v1/callback/email:
    post:
      consumes:
      - application/json
      description: 接收腾讯云邮件事件，不依赖登录 Cookie、CSRF 标识或既有发信记录。标准字段独立落库并按内容去重，未知扩展字段忽略；点击地址仅保存站点和路径。email.abnormal_events
        配置的事件直接永久拉黑收件邮箱，后续所有业务发信均拒绝该地址。不保存或校验 IP。
      parameters:
      - description: 与 email.callback_sign 一致的回调签名
        in: query
        name: sign
        required: true
        type: string
      - description: 腾讯云邮件通知事件
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emailModels.CallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 回调已落库，重复回调直接成功，data 为 null
          schema:
            $ref: '#/definitions/emailModels.EmptyResponse'
        "400":
          description: 回调参数无效
          schema:
            $ref: '#/definitions/emailModels.EmptyResponse'
        "401":
          description: 回调签名无效
          schema:
            $ref: '#/definitions/emailModels.EmptyResponse'
        "503":
          description: 回调暂时不可用，应重试
          schema:
            $ref: '#/definitions/emailModels.EmptyResponse'
      summary: 接收邮件事件回调
      tags:
      - 邮件
  /v1/change-password:
    post:
      consumes:
      - application/json
      description: |-
        仅待改密会话可用。验证当前密码后保存新密码、清除待改密状态、作废旧会话并设置新 Cookie。
        已有 API Token 保持有效。
      parameters:
      - default: "1"
        description: 跨站请求保护标识，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      - description: 当前密码与新密码摘要
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/userModels.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已修改密码并设置新会话 Cookie
          schema:
            $ref: '#/definitions/userModels.InfoResponse'
      summary: 修改临时密码
      tags:
      - 用户
  /v1/home/calendar:
    get:
      description: 无需登录。返回当日节假日与后续假期首日；连续同名日期视为一段假期，不包含补班安排。
      parameters:
      - description: 展示时区中的公历日期，YYYY-MM-DD，年份为 1000 至 9999
        example: "2027-01-01"
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homeModels.CalendarResponse'
        "400":
          description: 日期缺失、重复或格式无效
          schema:
            $ref: '#/definitions/homeModels.HealthResponse'
      summary: 查看首页节日
      tags:
      - 首页
  /v1/login:
    post:
      consumes:
      - application/json
      description: |-
        启用验证码时，需提交验证通过后的票据及随机串。仅启用且允许密码登录的账号可登录。
        全局密码登录关闭时统一返回 401，不创建会话；账号原有密码设置、邮件登录和已有会话保持不变。
        会话通过 HttpOnly Cookie 返回，待改密会话完成改密后才能访问业务接口。
      parameters:
      - default: "1"
        description: 跨站请求保护标识，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/userModels.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功并设置会话 Cookie
          schema:
            $ref: '#/definitions/userModels.InfoResponse'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
      summary: 用户名密码登录
      tags:
      - 用户
  /v1/login-captcha:
    post:
      description: 每次尝试登录前获取新密文。未启用验证码时 data 为 null。
      parameters:
      - default: "1"
        description: 跨站请求保护标识，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 登录验证码初始化参数
          schema:
            $ref: '#/definitions/userModels.LoginCaptchaResponse'
      summary: 获取登录验证码参数
      tags:
      - 用户
  /v1/login-email:
    post:
      consumes:
      - application/json
      description: 仅启用账号的用户名和已登记邮箱完全匹配时发送。安全验证规则与密码登录一致；邮件只包含 6 位数字验证码。返回独立随机校验标识及剩余有效秒数、重发等待秒数；重发成功后旧验证码失效。
      parameters:
      - default: "1"
        description: 跨站请求保护标识，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      - description: 用户名、邮箱和验证码参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/userModels.SendLoginEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 验证码已发送，返回本次校验信息
          schema:
            $ref: '#/definitions/userModels.EmailLoginChallengeResponse'
        "400":
          description: 参数或验证码无效
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "401":
          description: 用户名或邮箱错误
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "403":
          description: 邮箱已被禁止接收邮件
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "429":
          description: 同一组织账号请求发送验证码过于频繁
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "503":
          description: 账号或邮件登录暂时不可用
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
      summary: 发送登录邮件
      tags:
      - 用户
  /v1/login-email-verify:
    post:
      consumes:
      - application/json
      description: |-
        学生验证码同时复核绑定的启用空间、学号、登记邮箱和在籍状态，直接建立独立学生会话，Cookie 值以 aws_ 开头；响应 identity_type=student 且提供绑定空间编号及名称，不授予管理账号权限。
        校验发送接口返回的 challenge_id 和邮件中的 6 位数字验证码，按每次签发原子累计错误次数，达到 YAML 的 max_attempts 后失效，不因错误重试延长有效期。
        复核有效期、账号启用状态、登记邮箱和会话版本。首次邮件登录或邮箱变更后，未提交用户名时返回 username_required=true、user=null，不消费验证码或设置 Cookie；用户名逐字匹配后才消费验证码并建立会话。已核验邮箱可直接登录；消费后不恢复验证码，待改密账号仍须先修改密码。
      parameters:
      - default: "1"
        description: 跨站请求保护标识，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      - description: 本次校验标识、6 位数字验证码及待核验的用户名
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/userModels.EmailLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 待核验用户名，或登录成功并设置会话 Cookie
          schema:
            $ref: '#/definitions/userModels.EmailLoginResponse'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "401":
          description: 验证码错误、已过期、已失效或用户名不匹配
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "503":
          description: 账号或邮件登录暂时不可用
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
      summary: 邮件验证码登录
      tags:
      - 用户
  /v1/logout:
    post:
      description: |-
        使用 Cookie 仅撤销当前会话，学生只删除当前绑定空间的学生会话。
        API Token 和其他设备会话保持有效，审计失败时全部回滚。
      parameters:
      - default: "1"
        description: 跨站请求保护标识，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 当前会话已撤销，data 为 null
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
      summary: 退出登录
      tags:
      - 用户
