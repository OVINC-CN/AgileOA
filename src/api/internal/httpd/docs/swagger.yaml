  /v1/workspaces/{workspace_id}/student-dashboard:
    get:
      description: |-
        独立要求 student.dashboard.list，仅汇总当前空间状态为在籍的学生，班长同样限定在籍。
        班级和专业去除首尾空白后汇总，均按名称升序排列，历史空值保留。
        第一列为班级，中间按 majors 展开各专业人数，末两列为总数和班长，提供表尾合计。
        班长来自学生班内任职，不包含副班长；姓名去重排序后以英文逗号拼接，审计保存后返回。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 学生专业表
          schema:
            $ref: '#/definitions/studentdashboardModels.DataResponse'
      summary: 查询学生数据仪表
      tags:
      - 学生数据仪表
  /v1/workspaces/{workspace_id}/student-dashboard/accommodation:
    get:
      description: |-
        要求 student.dashboard.list，仅统计当前空间在籍学生，按住宿类型、园区、宿舍楼和宿舍号汇总人数。
        非校内住宿先将园区、楼栋和宿舍号归为空值，再筛选和聚合，每种非校内类型最多一行。
        同一字段多选取并集，不同字段取交集；省略条件表示不限，位置显式空值表示匹配归并后的空位置。
        返回全部分组及人数合计，读取审计提交后返回。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - collectionFormat: multi
        description: 住宿类型英文代码，支持多选
        in: query
        items:
          enum:
          - on_campus
          - off_campus
          - joint_abroad
          - unknown
          type: string
        name: accommodation_type
        type: array
      - collectionFormat: multi
        description: 住宿园区，支持多选；显式空值匹配空位置
        in: query
        items:
          type: string
        name: campus
        type: array
      - collectionFormat: multi
        description: 宿舍楼，支持多选；显式空值匹配空位置
        in: query
        items:
          type: string
        name: building
        type: array
      - collectionFormat: multi
        description: 宿舍号，支持多选，按文本保留前导零；显式空值匹配空位置
        in: query
        items:
          type: string
        name: room
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: 住宿分组及人数合计
          schema:
            $ref: '#/definitions/studentdashboardModels.AccommodationResponse'
      summary: 查询学生住宿信息表
      tags:
      - 学生数据仪表
  /v1/workspaces/{workspace_id}/student-dashboard/accommodation/export:
    get:
      description: |-
