    get:
      description: 仅限绑定空间的学生会话，未读优先、组内编号倒序，读取不自动标为已读。
      parameters:
      - description: 绑定的工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - default: 1
        description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - description: 每页条数，不超过 YAML 配置上限
        in: query
        name: page_size
        type: integer
      - default: unread
        description: 通知范围
        enum:
        - unread
        - all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 审计提交后返回
          schema:
            $ref: '#/definitions/notificationModels.ListResponse'
        "400":
          description: 分页参数或通知范围无效
          schema:
            $ref: '#/definitions/notificationModels.EmptyResponse'
        "401":
          description: 学生登录已失效
          schema:
            $ref: '#/definitions/notificationModels.EmptyResponse'
        "403":
          description: 不是绑定空间的学生会话
          schema:
            $ref: '#/definitions/notificationModels.EmptyResponse'
        "503":
          description: 服务暂时不可用
          schema:
            $ref: '#/definitions/notificationModels.EmptyResponse'
      summary: 查看我的学生通知
      tags:
      - 学生通知
  /v1/workspaces/{workspace_id}/student-service/notifications/read:
    post:
      consumes:
      - application/json
      description: 任一通知不属于绑定空间内的当前学生时整批不修改，重复提交保留首次已读时间。
      parameters:
      - description: 绑定的工作空间编号
        in: path
        name: workspace_id
