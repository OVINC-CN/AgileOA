      tags:
      - 用户管理
    put:
      description: |-
        仅系统管理员可为启用且已完成改密的账号生成或重置 Token。每个账号最多一个，旧值立即失效。
        仅撤销全部会话、停用账号、主动撤销或重置 Token 时撤销已有 Token，退出登录及密码变更不影响它。
        Token 仅用于 /v1/mcp，通过 Authorization: Bearer 传递，沿用账号状态和业务权限；其他接口使用 Cookie。
      parameters:
      - description: 账号编号
        in: path
        name: id
        required: true
        type: integer
      - default: "1"
        description: 固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 新 API Token，支持后续再次查看
          schema:
            $ref: '#/definitions/userModels.APITokenResponse'
        "400":
          description: 账号编号无效
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "401":
          description: 请先登录
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "403":
          description: 系统权限或跨站保护校验失败
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "404":
          description: 用户不存在
          schema:
