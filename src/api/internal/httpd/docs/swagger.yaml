          description: 删除成功
          schema:
            $ref: '#/definitions/accessModels.EmptyResponse'
      summary: 删除评优项目
      tags:
      - 评奖评优
    put:
      consumes:
      - application/json
      description: |-
        开启总分计算即忽略手填总分和排名；ranking_dimensions 支持年级、专业、班级的任意组合，空数组为全奖项统一排名；保存后后台重排全部已通过申报，入队失败回滚。
        在工作空间锁内复核修改权限及版本，同时维护 detail_names；已被评分引用的子项名称不可移除。
        允许自行申报时必须填写 self_apply_deadline；每次保存重新调度，截止时间变更后旧任务失效。
        审批级别、处理人或签署方式变更后，未完成申报清空有效签署并从新流程第一级重新审批；草稿仍为草稿，已通过申报保留最终流程。仅修改每级 allow_edit 时同步未完成申报并提升版本，保留进度和签署；省略保留原值。项目内容及申报开关实时读取最新配置。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - description: 记录编号
        in: path
        name: id
        required: true
        type: integer
      - description: 固定字段请求，修改时必须提供 revision
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/projectModels.ProjectRequest'
      - default: "1"
        description: 固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 审计提交后返回
          schema:
            $ref: '#/definitions/projectModels.ProjectResponse'
        "400":
          description: 项目字段或子项配置无效
          schema:
            $ref: '#/definitions/accessModels.EmptyResponse'
        "409":
          description: 记录版本冲突或子项配置仍被评分引用
          schema:
            $ref: '#/definitions/accessModels.EmptyResponse'
        "503":
          description: 自动提交或后台排名任务暂不可用
          schema:
            $ref: '#/definitions/accessModels.EmptyResponse'
