        导出完整固定字段及人数合计，所有单元格按文本保存；审计提交后返回 Base64 XLSX。
        行数及文件大小复用 student.max_export_rows、student.max_file_bytes，超限整体拒绝。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - collectionFormat: multi
        description: 住宿类型英文代码，支持多选
        in: query
        items:
          enum:
          - on_campus
          - off_campus
          - joint_abroad
          - unknown
          type: string
        name: accommodation_type
        type: array
      - collectionFormat: multi
        description: 住宿园区，支持多选；显式空值匹配空位置
        in: query
        items:
          type: string
        name: campus
        type: array
      - collectionFormat: multi
        description: 宿舍楼，支持多选；显式空值匹配空位置
        in: query
        items:
          type: string
        name: building
        type: array
      - collectionFormat: multi
        description: 宿舍号，支持多选，按文本保留前导零；显式空值匹配空位置
        in: query
        items:
          type: string
        name: room
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: 住宿信息表 XLSX
          schema:
            $ref: '#/definitions/studentdashboardModels.FileResponse'
      summary: 导出学生住宿信息表
      tags:
      - 学生数据仪表
  /v1/workspaces/{workspace_id}/student-dashboard/accommodation/filter-options:
    get:
      description: |-
        要求 student.dashboard.list，住宿类型返回英文 value 和中文 label，位置空值显示为半角短横线。
        园区、楼栋和宿舍号仅从在籍校内住宿学生读取，选项上限复用 student.max_options。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 住宿筛选选项
          schema:
            $ref: '#/definitions/studentdashboardModels.AccommodationOptionsResponse'
      summary: 学生住宿信息表筛选选项
      tags:
      - 学生数据仪表
  /v1/workspaces/{workspace_id}/student-dashboard/export:
    get:
      description: |-
        独立要求 student.dashboard.export，仅导出当前空间在籍学生的班级、专业人数、班长及合计。
        第一列为班级，末两列为总数和班长，专业列按名称升序排列，不受页面显示字段影响。
        复用 student.max_export_rows 限制班级行数、student.max_file_bytes 限制文件大小。
        全部单元格按文本保存，空名称保留空单元格；审计完成后返回 Base64 XLSX。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: XLSX 学生专业表
          schema:
            $ref: '#/definitions/studentdashboardModels.FileResponse'
      summary: 导出学生数据仪表
      tags:
      - 学生数据仪表
  /v1/workspaces/{workspace_id}/student-dashboard/fields:
    get:
      description: 复用 student.dashboard.list，提供学生专业表与住宿信息表的固定字段、类型、统计口径与示例。
