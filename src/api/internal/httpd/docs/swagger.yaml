  /v1/notifications:
    get:
      description: 未读优先，组内按编号倒序；读取不会自动标为已读。
      parameters:
      - description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - description: 每页条数，不超过 YAML 配置上限
        in: query
        name: page_size
        type: integer
      - default: unread
        description: 通知范围，默认仅查询未读通知
        enum:
        - unread
        - all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationModels.ListResponse'
        "400":
          description: 分页参数或通知范围无效
          schema:
            $ref: '#/definitions/notificationModels.EmptyResponse'
      summary: 查看我的通知
      tags:
      - 通知
  /v1/notifications/read:
    post:
      consumes:
      - application/json
      description: 整批通知必须全部属于当前账号，任一编号无效时不修改任何通知；重复提交幂等。
      parameters:
      - default: "1"
        description: 固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      - description: 待标记的通知编号
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notificationModels.ReadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationModels.ReadResponse'
        "400":
          description: 编号为空、重复或超过单次上限
          schema:
            $ref: '#/definitions/notificationModels.EmptyResponse'
        "404":
          description: 通知不存在或不可访问，整批不修改
          schema:
            $ref: '#/definitions/notificationModels.EmptyResponse'
      summary: 标记我的通知为已读
      tags:
      - 通知
  /v1/notifications/unread:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationModels.UnreadResponse'
      summary: 查看我的未读通知数量
      tags:
      - 通知
  /v1/student-login-email:
    post:
      consumes:
      - application/json
      description: 仅启用空间的名称、学号和登记邮箱逐字匹配，且学生状态为在籍时发送；不匹配统一提示用户不存在。邮件仅包含 6 位数字验证码，返回随机校验标识及剩余有效秒数、重发等待秒数；重发成功后旧验证码失效。
      parameters:
      - default: "1"
        description: 跨站请求保护标识，固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      - description: 空间名称、学号、邮箱和验证码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/userModels.SendStudentLoginEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 验证码已发送，返回本次校验信息
          schema:
            $ref: '#/definitions/userModels.EmailLoginChallengeResponse'
        "400":
          description: 参数或验证码无效
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "401":
          description: 用户不存在
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "403":
          description: 邮箱已被禁止接收邮件
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "429":
          description: 同一学生请求发送验证码过于频繁
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
        "503":
          description: 学生邮件登录暂时不可用
          schema:
            $ref: '#/definitions/userModels.EmptyResponse'
      summary: 发送学生登录邮件
      tags:
      - 用户
  /v1/system/access/actions:
    get:
      description: 仅系统管理员可查看稳定标识、名称、说明、分组、范围与接口；仅 workspace 可勾选授权。
      produces:
      - application/json
      responses:
        "200":
          description: 只读操作目录
          schema:
            $ref: '#/definitions/accessModels.CatalogResponse'
      summary: 操作权限目录
      tags:
      - 权限管理
  /v1/system/access/workspaces/{workspace_id}/users:
    get:
      description: 仅系统管理员可查询，默认仅返回当前空间至少有一项有效显式权限的账号；ungranted 返回未授权候选，停用账号及其他空间授权不改变本空间归类。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - default: 1
        description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - description: 每页数量，默认与上限来自 YAML
        in: query
        name: page_size
        type: integer
      - description: 用户名或显示名称关键词，最多 100 个字符
        in: query
        name: keyword
        type: string
      - default: granted
        description: 授权状态：granted 已授权，ungranted 未授权
        enum:
        - granted
        - ungranted
        in: query
        name: permission_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 用户分页目录
          schema:
            $ref: '#/definitions/accessModels.UserListResponse'
      summary: 工作空间用户列表
      tags:
      - 权限管理
  /v1/system/access/workspaces/{workspace_id}/users/{user_id}/actions:
    get:
      description: 仅系统管理员可操作；不从其他工作空间或系统身份推导权限。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - description: 全局账号编号
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 用户操作权限及版本
          schema:
            $ref: '#/definitions/accessModels.ActionsResponse'
      summary: 查询用户操作权限
      tags:
      - 权限管理
    put:
      consumes:
      - application/json
      description: 仅系统管理员可操作；仅接受登记的 workspace action，空数组撤销全部权限，未知、重复和系统操作均拒绝。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - description: 全局账号编号
        in: path
        name: user_id
        required: true
        type: integer
      - default: "1"
        description: 固定为 1
        in: header
        name: X-CSRF-Protection
        required: true
        type: string
      - description: 完整 action 列表与最近读取的版本
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/accessModels.UpdateActionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已更新操作权限
          schema:
            $ref: '#/definitions/accessModels.ActionsResponse'
      summary: 设置用户操作权限
      tags:
      - 权限管理
  /v1/system/audit/logs:
    get:
      description: 系统管理员查询标准事件，按数据库 ID 倒序。所有筛选均为标量精确条件。
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - collectionFormat: multi
        description: 用户租户，组织为 system，学生为所属空间
        in: query
        items:
          type: string
        name: user_identify_tenant_id
        type: array
      - description: 用户编号，十进制无符号整数，精确匹配
        in: query
        name: user_id
        type: string
      - collectionFormat: multi
        description: 业务空间编号，系统为 system
        in: query
        items:
          type: string
        name: workspace_id
        type: array
      - collectionFormat: multi
        description: 操作；省略默认 exclude_audit，显式空值为全部
        in: query
        items:
          type: string
        name: action_id
        type: array
      - collectionFormat: multi
        description: 数字结果码，成功为 0
        in: query
        items:
          type: integer
        name: result_code
        type: array
      - collectionFormat: multi
        description: 来源，web 为 1、mcp 为 2
        in: query
        items:
          type: integer
        name: access_type
        type: array
      - description: 对象编号精确匹配；显式空值匹配空编号
        in: query
        name: instance_id
        type: string
      - description: 32 位 Trace ID 精确匹配
        in: query
        name: request_id
        type: string
      - description: 开始时刻下界，UTC Unix 毫秒，包含
        in: query
        name: start_time
        type: string
      - description: 开始时刻上界，UTC Unix 毫秒，不包含
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 标准审计分页
          schema:
            $ref: '#/definitions/auditModels.ListResponse'
      summary: 审计日志列表
      tags:
      - 审计日志
  /v1/system/audit/logs/{id}:
    get:
      description: 系统管理员按事件编号和 UTC 日期读取普通快照，私有密文与关联上下文不返回。
      parameters:
      - description: 32 位十六进制 event_id
        in: path
        name: id
        required: true
        type: string
      - description: 开始时刻所属 UTC 日期，YYYY-MM-DD
        in: query
        name: event_date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 标准审计详情
          schema:
            $ref: '#/definitions/auditModels.DetailResponse'
      summary: 审计日志详情
      tags:
      - 审计日志
  /v1/system/audit/statistics:
    get:
      description: 两个时间参数均限制事件的 start_time，按 UTC 日期一次聚合总计与趋势。
      parameters:
      - collectionFormat: multi
        description: 用户租户，组织为 system，学生为所属空间
        in: query
        items:
          type: string
        name: user_identify_tenant_id
        type: array
      - description: 用户编号，十进制无符号整数，精确匹配
        in: query
        name: user_id
        type: string
      - collectionFormat: multi
        description: 业务空间编号，系统为 system
        in: query
        items:
          type: string
        name: workspace_id
        type: array
      - collectionFormat: multi
        description: 操作；省略默认 exclude_audit，显式空值为全部
        in: query
        items:
          type: string
