    get:
      description: |-
        仅查询当前账号负责或参与的工作。年份与月份均支持多选，省略时不限制对应维度；按日期及编号倒序，不分页。附件元数据单独检查读取权限，审计提交后返回。
        学生工作与党建工作通过各自路径访问，分别授权并隔离数据；请求体不接受类别字段。
      parameters:
      - description: 工作空间编号
        in: path
        name: workspace_id
        required: true
        type: string
      - collectionFormat: multi
        description: 年份，1900 至 9999；省略时不限制年份；支持多选，同一参数可重复传递
        in: query
        items:
          type: integer
        name: year
        type: array
      - collectionFormat: multi
        description: 月份，1 至 12；省略时不限制月份；支持多选，同一参数可重复传递
        in: query
        items:
          type: integer
        name: month
        type: array
      - description: 工作项目、负责人、参与人或详细说明关键词，最多 100 字符
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
