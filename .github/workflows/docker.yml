name: Docker

on:
  push:
    tags: [ '**' ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Set the image tag
        id: image
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          export LC_ALL=C
          if [[ ! $GITHUB_REF_NAME =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Git tag 不符合 Docker 标签格式'
            exit 1
          fi
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'tag=ghcr.io/%s:%s\n' "$repository" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: src/api
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.image.outputs.tag }}
