name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Web ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [check, test]
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}

  web-ci:
    name: Web quality and build
    if: ${{ always() }}
    needs: web-checks
    runs-on: ubuntu-latest
    steps:
      - name: Verify web checks
        env:
          CHECKS_RESULT: ${{ needs.web-checks.result }}
        run: test "$CHECKS_RESULT" = success

  api-ci:
    name: API quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum
      - run: make lint
      - run: make build
